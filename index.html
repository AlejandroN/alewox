<style>
/* Portada de Alewox: un escritorio real de noche con lluvia (video). Al tocar la laptop, todo se desenfoca menos ella
   y los servicios aparecen alrededor. */
:root {
  --tinta: #0c0b0a;
  --vidrio: rgba(16, 13, 11, .66);
  --linea: rgba(244, 239, 232, .16);
  --crema: #f4efe8;
  --gris: #b8afa5;
  --naranja: #ff7a3d;
  --naranja-2: #ffb08a;
  --verde-wa: #25d366;
  --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--tinta); color: var(--crema); font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--naranja-2); outline-offset: 3px; }
em { font-family: var(--serif); font-style: italic; font-weight: 400; }

/* ---------- la escena ---------- */
.escena { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 60%, #2a1a10, #0c0b0a 70%); }
/* sin will-change: así el navegador vuelve a dibujar nítido al acercar (si no, estira la imagen ya dibujada) */
.cuadro { position: absolute; transform-origin: 0 0; transition: transform 1.2s cubic-bezier(.2, .75, .1, 1); }
.cuadro > video, .cuadro > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.relampago { position: absolute; inset: 0; background: #cfe0ff; mix-blend-mode: screen; opacity: 0; pointer-events: none; }
/* todo se desenfoca menos la laptop: la máscara tiene un hueco con la forma de la laptop */
.borroso { position: absolute; inset: 0; backdrop-filter: blur(5px) brightness(.72); -webkit-backdrop-filter: blur(5px) brightness(.72); opacity: 0; transition: opacity .9s; pointer-events: none; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
.abierto .borroso { opacity: 1; }
.pie { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; height: 240px; background: linear-gradient(transparent, rgba(12, 11, 10, .85) 55%, #0c0b0a); opacity: 0; transition: opacity .9s; pointer-events: none; }
.abierto .pie { opacity: 1; }
.cuadro > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pantalla-toque { fill: transparent; cursor: pointer; }
.pantalla-toque:focus { outline: none; }
/* la pantalla "respira": un resplandor cálido que sube y baja, y que se sale un poco de la pantalla como luz real */
.brillo { opacity: 0; pointer-events: none; mix-blend-mode: screen; transition: opacity .6s; }
.llamando .brillo { animation: respira 2.6s ease-in-out infinite; }
.escena:has(.pantalla-toque:hover) .brillo, .escena:has(.pantalla-toque:focus-visible) .brillo { animation: none; opacity: .9; }
@keyframes respira { 0%, 100% { opacity: .08; } 50% { opacity: .85; } }
.abierto .brillo { animation: none; opacity: 0; }

/* el cursor de demostración que entra, hace click y abre todo */
.cursor { position: fixed; z-index: 7; left: 0; top: 0; width: 34px; height: 34px; pointer-events: none; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .55)); transform-origin: 4px 3px; }
.onda { position: fixed; z-index: 6; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid rgba(255, 190, 140, .95); box-shadow: 0 0 24px rgba(255, 140, 80, .8); pointer-events: none; opacity: 0; }

/* ---------- primera pantalla: lo mínimo ---------- */
.logo { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 18px); left: max(20px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; text-decoration: none; text-shadow: 0 2px 18px rgba(0, 0, 0, .6); }
.logo b { color: var(--naranja); }
.frase { position: fixed; z-index: 4; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 74px); margin: 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); max-width: 15ch; font-weight: 700; font-size: clamp(24px, 3.4vw, 38px); line-height: 1.04; letter-spacing: -.03em; text-wrap: balance; text-shadow: 0 2px 26px rgba(0, 0, 0, .65); pointer-events: none; transition: opacity .5s; }
.frase em { color: var(--naranja-2); }
.abierto .frase { opacity: 0; }
.aviso { position: absolute; z-index: 3; transform: translate(-50%, 0); white-space: nowrap; font: 600 13px var(--sans); background: rgba(12, 11, 10, .6); border: 1px solid var(--linea); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 7px 13px; border-radius: 999px; opacity: 0; transition: opacity .6s; pointer-events: none; }
.llamando .aviso { opacity: 1; }
.abierto .aviso { opacity: 0; }

/* ---------- los servicios alrededor de la laptop ---------- */
.anillo { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
/* tarjetas de vidrio: salen volando desde la pantalla de la laptop (--dx, --dy) y llegan con un pequeño rebote */
.bloque { position: absolute; width: min(250px, 42vw); transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(.2); opacity: 0; transition: opacity .45s, transform .85s cubic-bezier(.2, 1.35, .4, 1), border-color .3s, box-shadow .3s; text-align: left; padding: 14px 16px; border-radius: 18px; color: var(--crema); font: inherit; cursor: pointer; background: rgba(14, 12, 10, .4); border: 1px solid rgba(244, 239, 232, .13); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); box-shadow: 0 18px 40px rgba(0, 0, 0, .35); overflow: hidden; }
.abierto .bloque { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
/* luz que sigue al mouse dentro de la tarjeta */
.bloque::before { content: ""; position: absolute; inset: 0; background: radial-gradient(180px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 150, 90, .2), transparent 65%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.bloque:hover::before, .bloque.activo::before { opacity: 1; }
.bloque:hover, .bloque.activo { border-color: rgba(255, 150, 90, .55); box-shadow: 0 18px 50px rgba(0, 0, 0, .4), 0 0 30px rgba(255, 122, 61, .18); }
.bloque .dato { display: block; font: italic 400 30px/1 var(--serif); color: var(--naranja-2); margin-bottom: 6px; letter-spacing: -.01em; }
.bloque b { display: block; font-size: 18px; line-height: 1.1; letter-spacing: -.02em; }
.bloque span { display: block; margin-top: 4px; font-size: 13.5px; color: #e6ded4; }
.bloque small { display: inline-block; margin-top: 8px; font-weight: 700; font-size: 12px; color: var(--naranja-2); letter-spacing: .01em; }
.bloque.centro { text-align: center; }
.bloque.destacado { border-color: rgba(255, 122, 61, .6); background: rgba(255, 122, 61, .12); }

/* hilos de luz desde la laptop hacia cada servicio */
.hilos { position: fixed; inset: 0; z-index: 5; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .6s; }
.abierto .hilos { opacity: 1; }
.viendo .hilos { opacity: .25; }
.hilos path { fill: none; stroke: rgba(255, 150, 90, .45); stroke-width: 1.2; filter: drop-shadow(0 0 4px rgba(255, 122, 61, .8)); transition: stroke .3s, stroke-width .3s; }
.hilos path.activo { stroke: rgba(255, 190, 140, .95); stroke-width: 2; }
.hilos circle { fill: #ffd2a8; filter: drop-shadow(0 0 6px #ff8a45); }

/* la pantalla de la laptop "en vivo": muestra cada servicio */
.pantalla-viva { position: absolute; left: 0; top: 0; width: 800px; height: 500px; transform-origin: 0 0; overflow: hidden; opacity: 0; transition: opacity .45s; pointer-events: none; background: #0f0d0c; color: #f4efe8; font-family: var(--sans); border-radius: 6px; }
.pantalla-viva.ver { opacity: 1; }
.pantalla-viva.nitida { transition: opacity .2s; }
/* la pantalla nítida (vector) que tapa la del video mientras la cámara se acerca */
.p-logo { position: absolute; inset: 0; background: radial-gradient(52% 62% at 50% 46%, #5a2610, #2a140b 55%, #0c0b0a 100%); }
.p-logo .barra { position: absolute; left: 0; right: 0; top: 0; height: 22px; background: #141210; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font: 600 12px var(--sans); color: #f4efe8; }
.p-logo .bateria { display: inline-block; width: 26px; height: 11px; border: 1.5px solid #f4efe8; border-radius: 3px; margin-left: 10px; vertical-align: -1px; background: linear-gradient(90deg, #4ade80 0 62%, transparent 62%); }
.p-logo .centro-logo { position: absolute; inset: 22px 0 0; display: grid; place-content: center; justify-items: center; gap: 10px; }
.p-logo b { font: 800 54px/1 var(--sans); letter-spacing: -.03em; color: #f4efe8; }
.p-logo b i { color: #ff7a3d; font-style: normal; }
.p-logo small { font: 400 19px var(--sans); color: #a39b92; }
.escena-p { position: absolute; inset: 0; padding: 34px 40px; display: grid; align-content: start; gap: 18px; }
.escena-p h4 { margin: 0; font-size: 44px; letter-spacing: -.03em; line-height: 1; }
.escena-p h4 em { color: #ffb08a; }
.p-barra { display: flex; justify-content: space-between; font-size: 18px; color: #a39b92; }
.p-web { position: absolute; left: 0; right: 0; top: 0; animation: baja-web 5s ease-in-out infinite alternate; }
@keyframes baja-web { to { transform: translateY(-330px); } }
.p-hero { height: 300px; margin: 0 40px; border-radius: 18px; background: linear-gradient(135deg, #7a3b1e, #ff7a3d 55%, #ffd08a); display: grid; align-content: end; padding: 26px; font-weight: 800; font-size: 46px; letter-spacing: -.03em; }
.p-fila { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 40px; }
.p-fila div { height: 150px; border-radius: 14px; background: #2a221d; display: grid; align-content: end; padding: 14px; font-size: 18px; font-weight: 700; }
.p-chat { display: grid; gap: 14px; }
.p-chat div { max-width: 72%; padding: 14px 18px; border-radius: 16px; font-size: 24px; opacity: 0; animation: aparece .4s forwards; }
.p-chat .c { justify-self: end; background: #005c4b; }
.p-chat .b { justify-self: start; background: #1f2c33; }
@keyframes aparece { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.p-mapa { position: absolute; inset: 0; background: #1b2128; background-image: linear-gradient(#26303a 2px, transparent 2px), linear-gradient(90deg, #26303a 2px, transparent 2px); background-size: 70px 70px; }
.p-mapa .calle { position: absolute; background: #39434e; }
.p-pin { position: absolute; left: 50%; top: 42%; width: 46px; height: 46px; margin: -46px 0 0 -23px; background: #ff5a3d; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); animation: cae .7s cubic-bezier(.3, 1.6, .5, 1) both; box-shadow: 0 0 30px rgba(255, 90, 61, .6); }
@keyframes cae { from { transform: translateY(-160px) rotate(-45deg); opacity: 0; } }
.p-ficha { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); background: #f4efe8; color: #1c1410; padding: 14px 22px; border-radius: 14px; font-size: 22px; font-weight: 700; white-space: nowrap; animation: aparece .4s .5s both; }
.p-precios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.p-precios div { border: 2px solid #3a302a; border-radius: 16px; padding: 18px; display: grid; gap: 6px; animation: aparece .4s both; }
.p-precios div:nth-child(2) { border-color: #ff7a3d; background: rgba(255, 122, 61, .1); animation-delay: .12s; }
.p-precios div:nth-child(3) { animation-delay: .24s; }
.p-precios b { font-size: 18px; color: #a39b92; text-transform: uppercase; letter-spacing: .08em; }
.p-precios strong { font-size: 46px; letter-spacing: -.03em; }
.p-wa { display: grid; place-items: center; text-align: center; gap: 14px; height: 100%; align-content: center; }
.p-wa i { width: 110px; height: 110px; border-radius: 30px; background: #25d366; display: grid; place-items: center; font-style: normal; font-size: 60px; animation: late 1.6s ease-in-out infinite; }
@keyframes late { 50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(37, 211, 102, .6); } }
.p-escribe::after { content: "|"; animation: parpadeo 1s steps(1) infinite; color: #ffb08a; }
@keyframes parpadeo { 50% { opacity: 0; } }
@keyframes acerca { from { transform: scale(1.15); } }
.cerrar { position: fixed; z-index: 8; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea); background: rgba(12, 11, 10, .55); color: var(--crema); font-size: 20px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .4s; }
.abierto .cerrar { opacity: 1; pointer-events: auto; }

/* ---------- detalle de un servicio ---------- */
/* al elegir un servicio, la cámara entra a la pantalla de la laptop y la pantalla se vuelve la página de ese servicio */
.entrando .cuadro { transition: transform 1.05s cubic-bezier(.55, 0, .3, 1); }
.entrando .hilos, .entrando .pie { opacity: 0; }
.entrando .bloque { opacity: 0 !important; pointer-events: none !important; transition-delay: 0s !important; }
.entrando .cerrar { opacity: 0; pointer-events: none; }
.vista { position: fixed; z-index: 9; inset: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(24px, 4vw, 56px); align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 76px) max(28px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(28px, env(safe-area-inset-left, 0px)); background: radial-gradient(70% 60% at 32% 45%, rgba(255, 122, 61, .2), transparent 70%), radial-gradient(60% 50% at 80% 80%, rgba(255, 176, 138, .08), transparent 70%), #0c0b0a; opacity: 0; pointer-events: none; transform: scale(1.06); filter: blur(10px); transition: opacity .55s, transform .9s cubic-bezier(.2, .8, .2, 1), filter .7s; overflow-y: auto; }
.viendo .vista { opacity: 1; transform: none; filter: none; pointer-events: auto; }
.volver-esc { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 20px); left: max(24px, env(safe-area-inset-left, 0px)); border: 1px solid var(--linea); background: rgba(12, 11, 10, .55); color: var(--crema); font: 600 14px var(--sans); padding: 10px 16px; border-radius: 999px; cursor: pointer; }
.volver-esc:hover { border-color: rgba(255, 150, 90, .55); }
/* la pantalla en grande: misma escena que en la laptop, con marco y resplandor */
.vista-visual { position: relative; aspect-ratio: 16 / 10; width: 100%; max-width: 820px; justify-self: center; border-radius: 18px; padding: 10px; background: linear-gradient(160deg, #3a332e, #171412); box-shadow: 0 0 0 1px rgba(244, 239, 232, .08), 0 40px 120px rgba(0, 0, 0, .6), 0 0 90px rgba(255, 122, 61, .22); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .6s .25s, transform .9s .25s cubic-bezier(.2, .8, .2, 1); }
.viendo .vista-visual { opacity: 1; transform: none; }
.grande-marco { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 10px; }
.grande { position: absolute; left: 0; top: 0; width: 800px; height: 500px; transform-origin: 0 0; overflow: hidden; background: #0f0d0c; color: #f4efe8; font-family: var(--sans); }
.detalle { width: min(480px, 100%); justify-self: center; background: var(--vidrio); border: 1px solid var(--linea); border-radius: 22px; padding: 24px; backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2); box-shadow: 0 30px 90px rgba(0, 0, 0, .5); display: grid; gap: 14px; opacity: 0; transform: translateY(22px); transition: opacity .6s .45s, transform .9s .45s cubic-bezier(.2, .8, .2, 1); }
.viendo .detalle { opacity: 1; transform: none; }
.detalle .dato-grande { font: italic 400 42px/1 var(--serif); color: var(--naranja-2); }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opciones button { border: 1px solid var(--linea); background: rgba(244, 239, 232, .05); color: var(--crema); border-radius: 12px; cursor: pointer; font: 600 13px var(--sans); }
.opciones button[aria-checked="true"] { border-color: var(--naranja); box-shadow: 0 0 0 1px var(--naranja), 0 0 18px rgba(255, 122, 61, .3); }
.colores button { display: flex; gap: 3px; padding: 7px; }
.colores i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .2); }
.estilos button { display: grid; justify-items: center; gap: 2px; padding: 8px 14px; min-width: 84px; }
.estilos span { font-size: 24px; line-height: 1; }
@media (max-width: 860px) {
  .vista { grid-template-columns: 1fr; align-content: start; padding-top: calc(env(safe-area-inset-top, 0px) + 70px); gap: 18px; }
  .detalle { width: 100%; padding: 20px; }
}
.viendo .bloque { opacity: 0 !important; pointer-events: none !important; }
.detalle h3 { margin: 0; font-size: 26px; line-height: 1.05; letter-spacing: -.03em; }
.detalle .lema { margin: 4px 0 0; color: var(--gris); }

.volver { justify-self: start; border: 0; background: none; color: var(--naranja-2); font: 600 14px var(--sans); cursor: pointer; padding: 0; }
.puntos { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.puntos li { display: flex; gap: 10px; }
.puntos li::before { content: "✓"; color: var(--naranja); font-weight: 800; }
.precios { display: grid; gap: 8px; }
.precio { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--linea); padding-bottom: 8px; }
.precio strong { font-size: 22px; font-variant-numeric: tabular-nums; }
.precio span { color: var(--gris); font-size: 13.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 18px; font: 700 15px var(--sans); text-decoration: none; border: 0; cursor: pointer; }
.btn-wa { background: var(--verde-wa); color: #06210f; }
.btn-naranja { background: var(--naranja); color: var(--tinta); }
.chat { display: grid; gap: 7px; background: #0b141a; border-radius: 14px; padding: 12px; }
.chat div { max-width: 85%; padding: 7px 10px; border-radius: 10px; font-size: 14px; }
.chat .c { background: #005c4b; justify-self: end; }
.chat .b { background: #1f2c33; justify-self: start; }
.campo { display: grid; gap: 7px; }
.campo label { font-size: 13px; color: var(--gris); }
.campo input, .campo select { background: rgba(244, 239, 232, .07); border: 1px solid var(--linea); border-radius: 12px; color: var(--crema); font: 600 16px var(--sans); padding: 11px 13px; }

  .bloque { width: 44vw; padding: 9px 10px; border-radius: 14px; }

  .bloque { padding: 8px 10px; }

  .bloque small { font-size: 11px; margin-top: 4px; }

}

}

<body>

<div class="escena" id="escena">
  <div class="cuadro" id="cuadro">
    <img id="foto" alt="" aria-hidden="true">
    <video id="video" muted loop playsinline autoplay preload="auto" aria-label="Escritorio de noche con lluvia en la ventana y una laptop con el logo de Alewox"></video>
    <div class="relampago" id="relampago"></div>
    <div class="borroso" id="borroso"></div>
    <div class="pantalla-viva" id="viva" aria-hidden="true"></div>
    <svg id="capa" viewBox="0 0 1080 1920" preserveAspectRatio="none">
      <defs>
        <filter id="resplandor" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
        <radialGradient id="luz" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#ffd2a8"/><stop offset=".55" stop-color="#ff8a45"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
      </defs>
      <g class="brillo">
        <polygon id="halo" fill="#ff7a3d" opacity=".55" filter="url(#resplandor)" points=""></polygon>
        <polygon id="tinte" fill="url(#luz)" opacity=".35" points=""></polygon>
      </g>
      <polygon id="toque" class="pantalla-toque" tabindex="0" role="button" aria-label="Ver todo lo que Alewox puede hacer por tu negocio" points=""></polygon>
    </svg>

  const puntos = bloques.map((b) => {
    const s = SERVICIOS.find((x) => x.id === b.dataset.id);
    let [x, y] = lugares[cel ? s.cel : s.lugar];
    // que ninguna tarjeta se salga de la pantalla
    const mh = b.offsetHeight / 2 + 10, mw = b.offsetWidth / 2 + 8;
    x = Math.min(W - mw, Math.max(mw, x));
    y = Math.min(H - mh, Math.max(mh, y));
    Object.assign(b.style, { left: `${x}px`, top: `${y}px` });
    b.style.setProperty('--dx', `${S[0] - x}px`);
    b.style.setProperty('--dy', `${S[1] - y}px`);
    return { id: b.dataset.id, x, y };
  });
  dibujarHilos(S, puntos);
}

const detalle = document.getElementById('detalle');
const vista = document.getElementById('vista');
const marco = document.getElementById('marco');
const grande = document.getElementById('grande');
const escalarGrande = () => { grande.style.transform = `scale(${marco.clientWidth / 800})`; };
// la cámara se clava en la pantalla de la laptop hasta que la pantalla llena todo
function zambullir() {
  const W = innerWidth, H = innerHeight;
  const q = T.pantalla.map(([x, y]) => [x * escala, y * escala]);
  const bw = Math.max(...q.map((p) => p[0])) - Math.min(...q.map((p) => p[0]));
  const bh = Math.max(...q.map((p) => p[1])) - Math.min(...q.map((p) => p[1]));
  const z = Math.max(W / bw, H / bh) * 1.25;
  const c = [centroPantalla[0] * escala, centroPantalla[1] * escala];
  cuadro.style.transform = `translate(${W / 2 - izq - c[0] * z}px, ${H / 2 - arr - c[1] * z}px) scale(${z})`;
}
let viendoTimer;
function verDetalle(id) {
  const s = SERVICIOS.find((x) => x.id === id);
  clearInterval(ciclo);
  activar(id);
  detalle.innerHTML = `<i class="dato-grande">${esc(s.dato)}</i>${DETALLE[id]()}`;
  grande.innerHTML = id === 'muestra' ? paginaMuestra() : ESCENAS[id]();
  // antes de acercar, la pantalla del video se cambia por la versión nítida
  viva.innerHTML = pantallaNitida();
  viva.classList.add('nitida', 'ver');
  document.body.classList.add('entrando');
  zambullir();
  clearTimeout(viendoTimer);
  viendoTimer = setTimeout(() => {
    document.body.classList.add('viendo');
    vista.setAttribute('aria-hidden', 'false');
    escalarGrande();
    document.getElementById('volver').focus({ preventScroll: true });
  }, reducir ? 0 : 620);
  if (id === 'muestra') {
    // cada cambio se ve al instante en la pantalla grande
    const actualizar = () => {
      MUESTRA.n = document.getElementById('mNombre').value.trim() || 'Tu negocio';
      MUESTRA.g = document.getElementById('mGiro').value;
      grande.innerHTML = paginaMuestra();
      const q = new URLSearchParams(MUESTRA);
      document.getElementById('mIr').href = `https://alewox.com/muestra/?${q}`;
    };
    detalle.querySelectorAll('input, select').forEach((el) => el.addEventListener('input', actualizar));
    detalle.querySelectorAll('.opciones').forEach((grupo) => grupo.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      grupo.querySelectorAll('button').forEach((x) => x.setAttribute('aria-checked', x === b));
      if (b.dataset.c) MUESTRA.c = b.dataset.c;
      if (b.dataset.e) MUESTRA.e = b.dataset.e;
      actualizar();
    }));
    actualizar();
  }
}
// de regreso: la página se desvanece y la cámara sale de la pantalla hasta ver otra vez el escritorio
function volver() {
  clearTimeout(viendoTimer);
  document.body.classList.remove('viendo');
  vista.setAttribute('aria-hidden', 'true');
  setTimeout(() => {
    enfocar();
    // ya lejos, se regresa a la pantalla del video
    setTimeout(() => { document.body.classList.remove('entrando'); viva.classList.remove('ver'); }, 1100);
    ciclar();
  }, reducir ? 0 : 250);
}
anillo.addEventListener('click', (e) => { const b = e.target.closest('.bloque'); if (b) verDetalle(b.dataset.id); });
document.getElementById('volver').addEventListener('click', volver);
addEventListener('resize', () => { if (document.body.classList.contains('viendo')) escalarGrande(); });

// ---------- abrir y cerrar ----------
const escena = document.getElementById('escena');
// 1) a los 2 s la pantalla empieza a "respirar"; 2) a los 6.5 s, si nadie tocó, un cursor entra, hace click y abre
let llamar = setTimeout(() => escena.classList.add('llamando'), 2000);
let demo = reducir ? null : setTimeout(demostrar, 6500);
const cursor = document.getElementById('cursor');
const onda = document.getElementById('onda');
function demostrar() {
  if (abierto) return;
  const W = innerWidth, H = innerHeight;
  const x = izq + centroPantalla[0] * escala, y = arr + centroPantalla[1] * escala;
  const desde = [W + 40, H * 0.82], medio = [x + (W - x) * 0.45, y + (H * 0.82 - y) * 0.2];
  const viaje = cursor.animate([
    { transform: `translate(${desde[0]}px, ${desde[1]}px)`, opacity: 0 },
    { transform: `translate(${desde[0] - 60}px, ${desde[1] - 20}px)`, opacity: 1, offset: 0.12 },
    { transform: `translate(${medio[0]}px, ${medio[1]}px)`, opacity: 1, offset: 0.6 },
    { transform: `translate(${x}px, ${y}px)`, opacity: 1 },
  ], { duration: 1500, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'forwards' });
  viaje.onfinish = () => {
    if (abierto) return cursor.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
    // el click: el cursor se encoge, sale una onda de luz y se abre todo
    cursor.animate([{ transform: `translate(${x}px, ${y}px) scale(1)` }, { transform: `translate(${x}px, ${y}px) scale(.8)` }, { transform: `translate(${x}px, ${y}px) scale(1)` }], { duration: 260, delay: 250, fill: 'forwards' });
    Object.assign(onda.style, { left: `${x + 4}px`, top: `${y + 3}px` });
    onda.animate([{ opacity: 1, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(3.2)' }], { duration: 650, delay: 330, easing: 'ease-out' });
    setTimeout(() => {
      abrir();
      cursor.animate([{ opacity: 1, transform: `translate(${x}px, ${y}px)` }, { opacity: 0, transform: `translate(${x + 30}px, ${y + 40}px)` }], { duration: 500, fill: 'forwards' });
    }, 480);
  };
}
function abrir() {
  if (abierto) return;
  abierto = true;
  clearTimeout(llamar);
  clearTimeout(demo);
  escena.classList.remove('llamando');
  // primero se acomoda todo (las tarjetas quedan "dentro" de la pantalla) y luego salen volando
  enfocar();
  void anillo.offsetWidth;
  document.body.classList.add('abierto');
  activo = null;
  setTimeout(() => { if (abierto) { activar(SERVICIOS[1].id); ciclar(); } }, reducir ? 0 : 1200);
}
function cerrar() {
  if (document.body.classList.contains('entrando')) { volver(); return; }
  abierto = false;
  clearInterval(ciclo);
  activo = null;
  viva.classList.remove('ver');
  bloques.forEach((b) => b.classList.remove('activo'));
  document.body.classList.remove('abierto');
  cuadro.style.transform = '';
}
toque.addEventListener('click', () => (abierto ? cerrar() : abrir()));
toque.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abierto ? cerrar() : abrir(); } });
document.getElementById('cerrar').addEventListener('click', cerrar);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && abierto) cerrar(); });

// ---------- relámpagos de vez en cuando ----------
const flash = document.getElementById('relampago');
function relampago() {
  if (!abierto && !reducir) flash.animate([{ opacity: 0 }, { opacity: .3, offset: .06 }, { opacity: .04, offset: .18 }, { opacity: .2, offset: .28 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' });
  setTimeout(relampago, 14000 + Math.random() * 14000);
}
setTimeout(relampago, 6000);

acomodar();
document.getElementById('video').play().catch(() => {});
